<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>groupe</title>
    <link rel="stylesheet" href="CSS/groupe.css">
    <link rel="stylesheet" href="CSS/style.css">

</head>
<body>
    <header>
      <nav>
        <div class="logo">
          <img class="icon" src="assets/icon/icon.png" alt="" />
          <h1>Split<span>Mate</span></h1>
        </div>
        <div>
          <button class="button1"><img src="assets/icon/users-alt.png" alt=""></button>
        </div>
      </nav>
    </header>
    <main>
      <aside class="links">
          <button class="link-botton"><a href="index.html">Acceuil</a></button>
          <button class="link-botton"><a href="groupe.html">Groupes</a></button>
          <button class="link-botton"><a href="depense.html">Depenses</a></button>
          <button class="link-botton"><a href="soldes.html">Soldes</a></button>
          <button class="link-botton"><a href="Dashboard.html">Dashboard</a></button>
        </aside>
        <section class="hero-container">

            <form class="creerFormGroupe" id="formGroupe">
                <h1>Créer un groupe</h1>
                <p>Rassemblez vos dépenses dans un espace partagé.</p>
                <div id="creerNomGroupe">
                    <label for="nom"><h2>Nom du groupe</h2></label><br>
                    <input  type="text" name="nom" id="nom">

                </div>
                <div id="creerDescriptionGroupes">
                    <label class="input-description" for="description"><h2>Description</h2></label><br>
                    <textarea id="description" rows="7"></textarea>

                </div>
                <div id="typeDeviseGroupe">
                    <label for="devise"><h2>devise</h2></label><br>
                    <select name="devise" id="Devise">
                        <option value="le $">$</option>
                        <option value="le £">£</option>
                        <option value="le Dh">Dh</option>
                    </select>
                </div>
                <div id="creerDateDebutGroupe">
                    <label for="data"><h2>Date de début</h2></label><br>
                    <input type="date" name="data" id="data">
                </div>

                <div id="creerButtonGroupe">
                    <button type="submit">Créer un groupe</button>


                </div>




        </form>

      </section>
    </main>
    <script src="JS/groupe.js"></script>

</body>

</html>
