<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Document</title>
    <link rel="stylesheet" href="CSS/style.css" />
  </head>

  <body>
    <header>
      <nav>
        <div class="logo">
          <img class="icon" src="assets/icon/icon.png" alt="" />
          <h1>Split<span>Mate</span></h1>
        </div>
        <div>
          <button class="button1">
            <img src="assets/icon/users-alt.png" alt="" />
          </button>
        </div>
      </nav>
    </header>
    <main>
        <aside class="links">
          <button class="link-botton"><a href="index.html">Acceuil</a></button>
          <button class="link-botton">Groupes</button>
          <button class="link-botton"><a href="depense.html">Depenses</a></button>
          <button class="link-botton"><a href="soldes.html">Soldes</a></button>
          <button class="link-botton">Dashboard</button>
        </aside>
        <section class="depenses">
          <div>
            <p>Nouvelle depenses</p>
            <p>elle sera partagez entre les membres.</p>
          </div>
          <div class="inputs">
            <label for="">Titre:</label>
            <input class="input" type="text" name="titre" />
          </div>
          <div class="inputs">
            <label for="">Montant:</label>
            <input class="input" type="number" name="montant" />
          </div>
          <div class="inputs">
            <label for="">Date:</label>
            <input class="input" type="date" name="date" />
          </div>
          <div class="inputs">
            <label for="">Categorie:</label>
            <select class="input" name="" id="">
              <option value="Transport">Transport</option>
              <option value="Food">Food</option>
              <option value="Hotel">Hotel</option>
            </select>
          </div>
          <div class="inputs">
            <label for="">Paye par:</label>
            <select class="input" name="" id="">
              <option value="">1</option>
              <option value="">2</option>
              <option value="">3</option>
            </select>
          </div>
          <div>
            <button class="button-despense">Enregistrer la depense</button>
          </div>
      </section>
    </main>
